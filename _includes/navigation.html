<nav class="nav-strip" aria-label="Primary navigation">
	<div class="container nav-inner">
		<button class="nav-toggle" id="open-nav" type="button" aria-label="Toggle navigation">&#9776;</button>

		<div class="nav-links">
			<a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Front Page</a>
			{% for link in site.data.navigation %}
				{% assign class = "" %}
				{% if link.link == page.url %}
					{% assign class = "active" %}
				{% endif %}
				<a href="{% include relative-src.html src=link.link %}" class="{{ class }}" {% if link.new_window %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ link.name }}</a>
			{% endfor %}
		</div>

		<div class="nav-actions">
			<div id="search-container" class="search-wrap">
				<input type="text" id="search-input" placeholder="Search dispatches..." aria-label="Search articles">
				<ul id="results-container" class="search-results"></ul>
			</div>
			<button type="button" id="theme-toggle" class="theme-btn" aria-label="Toggle light or dark reading theme">Night Ink</button>
		</div>
	</div>
</nav>

<script src="{{ site.baseurl }}/js/simple-jekyll-search.min.js"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    json: '{{ site.baseurl }}/search.json',
    searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
    noResultsText: '<li><a href="{{ site.baseurl }}/updates/">No matching dispatches found</a></li>'
  });

  document.getElementById('search-input').addEventListener('focus', function() {
    document.getElementById('results-container').style.display = 'block';
  });
  document.getElementById('search-input').addEventListener('blur', function() {
    setTimeout(function() {
      document.getElementById('results-container').style.display = 'none';
    }, 200);
  });
</script>
